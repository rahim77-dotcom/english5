<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English за 5 минут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Тетрадь в клетку: синие чернила, красные поля, карточка по центру */
:root{
  --paper:#fbfcfe; --grid:#e4eaf4; --ink:#1f3f99; --ink-soft:#e8eefc; --text:#18202e; --muted:#5d6779;
  --margin:#d9534f; --ok:#22875a; --ok-soft:#e3f4ea; --bad:#c8443f; --bad-soft:#fbe7e6; --card:#ffffff; --line:#d5dceb;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif; --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161f; --grid:#1b2230; --ink:#93b1ff; --ink-soft:#1c2740; --text:#e7ebf3; --muted:#9aa4b6;
  --margin:#ff7a73; --ok:#5fd394; --ok-soft:#173326; --bad:#ff7b72; --bad-soft:#3a1d1d; --card:#171d28; --line:#283246; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161f; --grid:#1b2230; --ink:#93b1ff; --ink-soft:#1c2740; --text:#e7ebf3; --muted:#9aa4b6;
  --margin:#ff7a73; --ok:#5fd394; --ok-soft:#173326; --bad:#ff7b72; --bad-soft:#3a1d1d; --card:#171d28; --line:#283246; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--text);font:16px/1.5 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;}
.wrap{max-width:640px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:var(--ink);letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.streak{font-family:var(--f-mono);font-size:.85rem;color:var(--margin);border:1.5px solid var(--margin);border-radius:999px;padding:2px 10px;white-space:nowrap}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
nav.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.88rem;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;position:relative}
.sheet.margin{padding-left:30px}
.sheet.margin::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.7}
.stack{display:flex;flex-direction:column;gap:14px}
.big-start{display:block;width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--paper);padding:20px;text-align:left}
.big-start b{display:block;font-family:var(--f-display);font-size:1.45rem;font-weight:700}
.big-start span{opacity:.85;font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .n{font-family:var(--f-mono);font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--ink-soft);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink-soft);border-color:var(--ink);color:var(--ink);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
/* Сессия */
.progress{height:6px;background:var(--ink-soft);border-radius:9px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.sessbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}
.kind{font-family:var(--f-mono);font-size:.75rem;color:var(--margin);letter-spacing:.04em;text-transform:uppercase}
.prompt{font-size:1.35rem;font-weight:600;margin:6px 0 4px;line-height:1.35;overflow-wrap:anywhere}
.prompt.en{font-family:var(--f-body)}
.sub{color:var(--muted);font-size:.9rem}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:12px 14px;text-align:left;font-size:1rem;display:flex;gap:10px;align-items:baseline}
.opt kbd{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field label{font-size:.78rem;color:var(--muted)}
input.ans{font:500 1.1rem var(--f-mono);padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--text);width:100%}
input.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
input.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--ink-soft);color:var(--ink)}
.btn.okb{background:var(--ok);color:var(--paper)}
.btn.badb{background:var(--bad);color:var(--paper)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--text)}
.feedback.bad b{color:var(--bad)}
.say{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--ink);margin-left:6px;vertical-align:middle}
/* Правило */
.rule h2{font-family:var(--f-display);font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.3}
.rule p{margin:8px 0}
.rule i{color:var(--ink);font-style:normal;font-weight:500}
.rule table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.93rem}
.rule td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tablewrap{overflow-x:auto}
.mini-rule{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:.92rem}
.mini-rule h3{font-size:.95rem;color:var(--ink);margin-bottom:4px}
/* Списки */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .u{font-family:var(--f-mono);font-size:.78rem;color:var(--margin);min-width:42px}
.li .t{flex:1;min-width:0}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);display:block}
.dots i.on{background:var(--ink)}
.vt{width:100%;border-collapse:collapse;font-size:.92rem}
.vt th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1.5px solid var(--line)}
.vt td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.vt td.f{font-family:var(--f-mono);font-size:.86rem;color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--text);font:inherit}
.result-n{font-family:var(--f-display);font-size:2.2rem;color:var(--ink)}
.mist{font-size:.92rem;padding:6px 0;border-bottom:1px solid var(--line)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea.ans{font:400 .95rem/1.45 var(--f-body);resize:vertical}
.board tr.me td{background:var(--ink-soft)}
.board th,.board td.f{white-space:nowrap}
@media (max-width:420px){.tiles{grid-template-columns:repeat(3,1fr)}.tile{padding:10px}.prompt{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ====== ПРАВИЛА (из ДЗ 1.1–4.7) ====== */
const RULES = [
{id:"be",sec:1,unit:"1.1",title:"To be: am / is / are",
body:`<p>Глагол «быть» меняется по лицам:</p>
<table><tr><td>I</td><td><b>am</b> → I'm</td></tr><tr><td>he / she / it</td><td><b>is</b> → he's, she's, it's</td></tr><tr><td>we / you / they</td><td><b>are</b> → we're, you're, they're</td></tr></table>
<p><b>Отрицание:</b> I'm not, he <b>isn't</b>, they <b>aren't</b>.<br><b>Вопрос:</b> глагол вперёд — <i>Are you a student? Is it a dog?</i></p>`,
qs:[["I ___ a student.","am","is","are"],["They ___ enemies.","are","is","am"],["It ___ a dog.","is","are","am"],["We ___ adults.","are","is","am"],{t:"Короткая форма: they are",a:["they're"]},{t:"Короткая форма: she is",a:["she's"]},["___ you at school? — No, I'm not.","Are","Is","Am"],["He ___ busy. (не)","isn't","aren't","am not"]]},

{id:"beq",sec:1,unit:"1.2",title:"Вопросы и краткие ответы с to be",
body:`<p>В вопросе <b>am / is / are</b> встаёт перед подлежащим:</p>
<p><i>You are from England.</i> → <b>Are you</b> from England?</p>
<p><b>Краткие ответы</b> — без сокращения в «да»:<br><i>Is he busy? — Yes, he <b>is</b>. / No, he <b>isn't</b>.</i><br><i>Am I right? — Yes, you <b>are</b>.</i></p>
<p>Возраст — через to be: <i>I'm 20 (years old).</i></p>`,
qs:[["Как правильно?","Are you from England?","You are from England?","Are from you England?"],["Is he busy? — Yes, ___.","he is","he's","is he"],["Am I right? — Yes, ___.","you are","I am","you is"],["Are they with us? — No, ___.","they aren't","they isn't","we aren't"],["What's your age?","I'm 20 years old.","I have 20 years.","I am 20 year."],["Как правильно?","Is it a dog?","It is a dog?","Is a dog it?"]]},

{id:"poss",sec:1,unit:"1.3",title:"Притяжательные: my, your, his…",
body:`<table><tr><td>I → <b>my</b></td><td>we → <b>our</b></td></tr><tr><td>you → <b>your</b></td><td>they → <b>their</b></td></tr><tr><td>he → <b>his</b></td><td>it → <b>its</b> (без апострофа!)</td></tr><tr><td>she → <b>her</b></td><td></td></tr></table>
<p>Ставятся перед существительным: <i>my name, their children</i>.<br><b>its</b> = «его/её» (о предмете), а <b>it's</b> = it is.</p>`,
qs:[["Это мой сын. ___ surname is Smith.","His","He","Her"],["We are programmers. ___ boss is Zurab.","Our","We","Their"],["She's British, but all ___ friends are American.","her","she","his"],["The game is famous for ___ safety.","its","it's","their"],["they → ?","their","they","them"],["Как правильно?","What's your address?","What's you address?","What's yours address?"]]},

{id:"plural",sec:1,unit:"1.4",title:"Множественное число",
body:`<table><tr><td>обычно <b>+s</b></td><td>key → keys, pen → pens</td></tr><tr><td>-s, -sh, -ch, -x → <b>+es</b></td><td>watch → watches, box → boxes, match → matches</td></tr><tr><td>согласная + y → <b>-ies</b></td><td>city → cities, diary → diaries</td></tr><tr><td>гласная + y → <b>+s</b></td><td>toy → toys, key → keys</td></tr></table>
<p><b>Исключения:</b> man → men, woman → women, child → children, person → people, tooth → teeth, foot → feet.</p>`,
qs:[{t:"a city → (мн. число)",a:["cities"]},{t:"a child → (мн. число)",a:["children"]},{t:"a watch → (мн. число)",a:["watches"]},{t:"a toy → (мн. число)",a:["toys"]},["a tooth →","teeth","tooths","toothes"],["a person →","people","peoples","personies"],["a dictionary →","dictionaries","dictionarys","dictionaryes"],["a woman →","women","womans","womens"]]},

{id:"art",sec:1,unit:"1.4",title:"Артикли a / an / the",
body:`<p><b>a</b> — перед согласным звуком: <i>a book, a new car</i>.<br><b>an</b> — перед гласным звуком: <i>an apple, an umbrella, an artist</i>.<br>(a/an — «какой-то, один», только ед. число исчисляемых)</p>
<p><b>the</b> — конкретный, уже упомянутый или единственный:<br><i>Sarah has <b>an</b> idea, and <b>the</b> idea is very interesting.</i></p>`,
qs:[["There is ___ apple on the table.","an","a","—"],["I want to buy ___ new book.","a","an","the"],["Mick has a friend. And ___ friend is really great.","the","a","an"],["He wants to be ___ artist.","an","a","the"],["Sarah has ___ idea.","an","a","the"],["I saw ___ elephant at the zoo.","an","a","the"]]},

{id:"this",sec:1,unit:"1.5",title:"This / that / these / those",
body:`<table><tr><td></td><td><b>рядом (here)</b></td><td><b>далеко (there)</b></td></tr><tr><td>ед. ч.</td><td><b>this</b> — этот</td><td><b>that</b> — тот</td></tr><tr><td>мн. ч.</td><td><b>these</b> — эти</td><td><b>those</b> — те</td></tr></table>
<p><i>This is my copybook and that is your copybook over there.</i></p>`,
qs:[["___ are my colleagues. (рядом, их много)","These","This","Those"],["___ car over there is cool!","That","This","These"],["Do you know ___ boys there?","those","these","that"],["Check ___ book here.","this","that","these"],["___ is my copybook and ___ is yours over there.","This … that","That … this","These … those"],["___ man here is brave!","This","Those","These"]]},

{id:"req",sec:1,unit:"1.6",title:"Просьбы: Can / Could I have…?",
body:`<p><b>Can I have</b> a coffee, please? — Можно мне кофе?<br><b>Could I have</b> … — то же, но вежливее.</p>
<p><b>How much is</b> it? — Сколько стоит? — <i>That's two euros.</i><br><b>Here you are.</b> — Вот, пожалуйста (когда даёшь).</p>
<p>a <b>single</b> ticket — в одну сторону, a <b>return</b> ticket — туда и обратно.</p>`,
qs:[["Как правильно?","Can I have a coffee, please?","I can have a coffee, please?","Can have I a coffee, please?"],["Что вежливее?","Could I have a cheese sandwich?","Give me a cheese sandwich."],["Как спросить цену?","How much is it?","How many is it?","What cost it?"],["Продавец отдаёт покупку:","Here you are.","Here are you.","There you go to."],["Билет туда и обратно —","a return ticket","a single ticket","a back ticket"]]},

{id:"ps",sec:1,unit:"1.7",title:"Present Simple: +s и don't / doesn't",
body:`<p>Привычки и регулярные действия. <b>he / she / it</b> → глагол <b>+s</b>:</p>
<table><tr><td>I / you / we / they</td><td><i>work, watch, go</i></td></tr><tr><td>he / she / it</td><td><i>work<b>s</b>, watch<b>es</b>, go<b>es</b>, stud<b>ies</b>, <b>has</b></i></td></tr></table>
<p><b>Отрицание:</b> don't / <b>doesn't</b> + глагол <u>без -s</u>:<br><i>My brother doesn't cook. People don't smoke.</i></p>`,
qs:[["My neighbour ___ a lot of documentaries.","watches","watch","watchs"],["People in my country ___ inside public buildings.","don't smoke","doesn't smoke","not smoke"],["My brother ___ very often.","doesn't cook","don't cook","doesn't cooks"],["The bus ___ at every traffic light.","stops","stop","stopes"],["My grandparents ___ the gardening every Sunday.","do","does","dos"],{t:"He (go) to work by car. → He ___",a:["goes"]},["She ___ a car very fast!","drives","drive","driving"],["We don't ___ any pets.","have","has","haves"]]},

{id:"psq",sec:1,unit:"1.8",title:"Вопросы в Present Simple",
body:`<p><b>Do / Does + кто + глагол?</b><br><i>Do you like coffee? <b>Does</b> she like coffee?</i> (после does — без -s)</p>
<p><b>Вопросительные слова</b> — в начало:<br><b>What</b> — что, <b>Where</b> — где, <b>When</b> — когда, <b>Who</b> — кто, <b>How often</b> — как часто.<br><i>Where do you live? How often do you exercise?</i></p>
<p><b>What do you do?</b> — Кем ты работаешь?</p>`,
qs:[["Как правильно?","Where do you live?","Where you live?","Where does you live?"],["___ she like coffee?","Does","Do","Is"],["___ do you exercise? — Three times a week.","How often","When","Where"],["___ is your favourite actor? — Brad Pitt.","Who","What","Where"],["___ do you go to sleep? — At 10 pm.","When","Where","Who"],["___ they have any siblings?","Do","Does","Have"],["What do you do? — это","Кем ты работаешь?","Что ты делаешь сейчас?"]]},

{id:"gen",sec:2,unit:"2.1",title:"Притяжательный падеж 's",
body:`<p>Чей? — <b>'s</b>: <i>the boy<b>'s</b> cap, my cat<b>'s</b> toy, Saada<b>'s</b> room</i>.</p>
<p>Мн. число на -s → только апостроф: <i>my parent<b>s'</b> car, the dog<b>s'</b> food</i>.<br>Мн. число без -s → 's: <i>the children<b>'s</b> toys</i>.</p>
<p><i>My mother's brother</i> = my uncle.</p>`,
qs:[["The ___ desk is full of books. (teacher)","teacher's","teachers","teacher"],["Our ___ car is parked outside. (parents)","parents'","parent's","parents's"],["His ___ bicycle is blue. (sister)","sister's","sisters","sister"],["Как правильно?","Our teacher's name is Mr. Johnson.","Our teacher name's is Mr. Johnson.","Our teachers name is Mr. Johnson."],["My mother's brother is my…","uncle","cousin","aunt"],["My aunt's child is my…","cousin","nephew","sibling"]]},

{id:"time",sec:2,unit:"2.3",title:"Который час: past / to",
body:`<p><b>:00</b> — <i>nine o'clock</i><br><b>1–30 минут</b> → <b>past</b> (после): 9:15 <i>quarter past nine</i>, 7:20 <i>twenty past seven</i>, 11:30 <i>half past eleven</i><br><b>31–59 минут</b> → <b>to</b> (до следующего часа): 4:50 <i>ten to five</i>, 4:55 <i>five to five</i>, 8:45 <i>quarter to nine</i></p>
<p><b>a.m.</b> — до полудня, <b>p.m.</b> — после.</p>`,
qs:[["09:15","quarter past nine","quarter to nine","fifteen to nine"],["11:30","half past eleven","half past twelve","half to twelve"],["04:55","five to five","five past four","fifty-five past four"],["07:20","twenty past seven","twenty to seven","seven twenty past"],["04:50","ten to five","ten past four","fifty to five"],["18:30 — это","half past six p.m.","half past six a.m.","half to six p.m."],["07:25","twenty-five past seven","twenty-five to seven","thirty-five to eight"]]},

{id:"freq",sec:2,unit:"2.5",title:"Как часто: always, usually…",
body:`<p><b>always</b> 100% · <b>usually</b> 80% · <b>often</b> 60% · <b>sometimes</b> 40% · <b>rarely</b> 20% · <b>hardly ever</b> 5% · <b>never</b> 0%</p>
<p><b>Место:</b> перед смысловым глаголом — <i>I <b>always</b> wash my face</i>,<br>но после to be — <i>She is <b>always</b> late</i>.</p>
<p><i>every day, once a week, twice a month, three times a year</i> — в конце предложения.</p>`,
qs:[["Как правильно?","We hardly ever eat junk food.","We eat hardly ever junk food.","Hardly ever we eat junk food."],["He ___ «thank you». (всегда)","always says","says always","always say"],["Как правильно?","She is always late.","She always is late.","Always she is late."],["80% — это","usually","often","sometimes"],["twice a year —","два раза в год","каждые два года","дважды в неделю"],["0% —","never","rarely","hardly ever"]]},

{id:"prep",sec:2,unit:"2.6",title:"Предлоги времени at / on / in",

{id:"ord",sec:2,unit:"2.6",title:"Порядковые: first, second…",
body:`<p><b>1st</b> first · <b>2nd</b> second · <b>3rd</b> third · далее <b>+th</b>: fourth, sixth…</p>
<p>Особые: <b>fifth</b> (5), <b>eighth</b> (8), <b>ninth</b> (9), <b>twelfth</b> (12), <b>twentieth</b> (20, y → ie).</p>
<p>Составные — меняется только последнее: <i>twenty-<b>first</b>, thirty-<b>third</b>, forty-<b>eighth</b></i>.<br>Дата: <i>on the 20th of August</i>.</p>`,
qs:[{t:"22nd словами",a:["twenty-second","twenty second"]},{t:"3rd словами",a:["third"]},{t:"41st словами",a:["forty-first","forty first"]},["5th","fifth","fiveth","fivth"],["12th","twelfth","twelveth","twelvth"],["20th","twentieth","twentyth","twentith"],["33rd","thirty-third","thirty-three","thirty-thirdth"]]},

{id:"sugg",sec:2,unit:"2.7",title:"Предложить и отреагировать",
body:`<p><b>Are you free</b> tomorrow? · <b>What would you like to</b> do?<br><b>How about</b> go<b>ing</b> to the cinema? (после how about — -ing)<br><b>Sounds good!</b> — Отлично, давай!</p>
<p><b>Хорошая новость:</b> That's great / fantastic / wonderful!<br><b>Плохая новость:</b> That's a shame (жаль) / awful / terrible!</p>`,
qs:[["How about ___ to the karaoke?","going","go","to go"],["«We've got a new baby!» —","That's fantastic!","That's a shame!","That's terrible!"],["«My sister isn't very well.» —","That's a shame!","That's great!","Sounds good!"],["«The airport's closed.» —","That's terrible!","That's wonderful!","That's fantastic!"],["Согласиться на предложение:","Sounds good!","How about?","I don't like."],["Are you ___ tomorrow? (свободен)","free","empty","open"]]},

{id:"ing",sec:2,unit:"2.8",title:"like / love / hate + -ing",
body:`<p>После <b>like, love, enjoy, hate, can't stand</b> — глагол с <b>-ing</b>:<br><i>He enjoys play<b>ing</b> basketball. They hate clean<b>ing</b> their room.</i></p>
<p><b>Как писать -ing:</b><br>обычно +ing: work → working<br>немая -e убирается: drive → driv<b>ing</b>, exercise → exercis<b>ing</b><br>короткий слог «согл.-гласн.-согл.» → удвоение: shop → sho<b>pp</b>ing, swim → swi<b>mm</b>ing<br>брит.: travel → trave<b>ll</b>ing</p>`,
qs:[{t:"drive + ing",a:["driving"]},{t:"shop + ing",a:["shopping"]},{t:"sing + ing",a:["singing"]},["They hate ___ their room.","cleaning","to cleaning","clean"],["We can't stand ___ to loud music.","listening","to listening","listen"],["He enjoys ___ basketball.","playing","play","to playing"],["swim + ing →","swimming","swiming","swimmming"]]},

{id:"pron",sec:3,unit:"3.1",title:"I или me? Местоимения",
body:`<table><tr><td>кто? (перед глаголом)</td><td>I · you · he · she · it · we · they</td></tr><tr><td>кого? кому? (после глагола)</td><td><b>me</b> · you · <b>him</b> · <b>her</b> · it · <b>us</b> · <b>them</b></td></tr></table>
<p><i>He loves dogs. Do they love <b>him</b>? · Can you show <b>me</b> the way?</i></p>`,
qs:[["He loves dogs. Do they love ___?","him","he","his"],["She talks to Sarah. She sees ___ every day.","her","she","hers"],["I have a ball. I love ___.","it","him","its"],["Can you show ___ the way to the park?","me","I","my"],["we →","us","our","we"],["The cat hates dogs. It really hates ___.","them","they","their"]]},

{id:"was",sec:3,unit:"3.2",title:"Was / were",
body:`<p>Прошедшее от to be:</p>
<table><tr><td>I / he / she / it</td><td><b>was</b> · wasn't</td></tr><tr><td>we / you / they</td><td><b>were</b> · weren't</td></tr></table>
<p><b>Вопрос:</b> <i>Was he an explorer? Were they happy?</i><br><b>Родился:</b> <i>He <b>was born</b> in 1904.</i></p>`,
qs:[["Columbus ___ from Italy.","was","were","is"],["They ___ the first people from Europe. (не)","weren't","wasn't","didn't"],["Where ___ he from?","was","were","did"],["___ the Wright brothers inventors?","Were","Was","Did"],["He ___ born in Osnabrück.","was","were","did"],["Were you at home? — No, I ___.","wasn't","weren't","didn't"]]},

{id:"ed",sec:3,unit:"3.3",title:"Past Simple: правильные -ed",
body:`<p>Прошедшее: глагол <b>+ed</b> для всех лиц. <i>I watched, she watched.</i></p>
<p>like → like<b>d</b> · study → stud<b>ied</b> (согл. + y) · play → play<b>ed</b> (гласн. + y) · stop → sto<b>pp</b>ed (удвоение)</p>
<p>Маркеры: <b>yesterday, last week, ago, in 2010</b>.</p>`,
qs:[{t:"talk → (прошедшее)",a:["talked"]},{t:"study → (прошедшее)",a:["studied"]},{t:"stop → (прошедшее)",a:["stopped"]},["play →","played","plaied","playd"],["like →","liked","likeed","likked"],["Слово-сигнал прошедшего:","yesterday","now","every day"]]},

{id:"did",sec:3,unit:"3.3",title:"Past Simple: didn't и Did…?",
body:`<p><b>Отрицание:</b> didn't + глагол <u>в 1-й форме</u>: <i>I didn't stud<b>y</b></i> (не studied!)<br><b>Вопрос:</b> Did + кто + глагол: <i>Did you watch it? — Yes, I did.</i><br><i>When <b>did</b> you watch it? What did you do?</i></p>
<p>С <b>was / were</b> did не нужен: <i>Were you at home?</i><br>can → <b>could</b> / couldn't: <i>He couldn't come.</i></p>`,
qs:[["I ___ biology. (не изучал)","didn't study","didn't studied","not studied"],["Как правильно?","When did you watch it?","When you watched it?","When did you watched it?"],["What ___ you do at work today?","did","do","were"],["Mike ___ go to a hospital last week. (не)","didn't","doesn't","wasn't"],["___ you like the film?","Did","Were","Was"],["Did she have a car? — No, she ___.","didn't","wasn't","hasn't"],["Steve ___ come to our meeting last Friday. (не смог)","couldn't","can't","didn't could"]]},

{id:"irr",sec:3,unit:"3.3–3.6",title:"Неправильные глаголы в речи",
body:`<p>Не получают -ed — их надо знать: <b>go → went → gone</b>.</p>
<p>В Past Simple — <b>2-я форма</b>: <i>I went, she bought, we had</i>.<br>После <b>did / didn't</b> — снова <b>1-я форма</b>: <i>I didn't go. Did you buy?</i><br>3-я форма понадобится позже (Present Perfect).</p>
<p>Таблица и тренировка — во вкладке «Глаголы».</p>`,
qs:[["Last summer I ___ to the beach.","went","goed","go"],["He ___ a new car yesterday.","bought","buyed","buys"],["I didn't ___ my keys.","lose","lost","losed"],["Somebody ___ my laptop.","took","taked","take"],["The police ___ the money in an old bag.","found","finded","find"],["We ___ a noise downstairs.","heard","heared","hear"]]},

{id:"ghg",sec:3,unit:"3.4",title:"Go / have / get + слово",
body:`<p><b>go</b> to school, home, away, abroad, for a walk, shopping</p>
<p><b>have</b> breakfast / lunch / dinner, a shower, a bath, a drink, a cup of tea, a picnic, a party</p>
<p><b>get</b> up, dressed, home, back home, a gift, a taxi</p>`,

{id:"pc",sec:4,unit:"4.2",title:"Present Continuous — прямо сейчас",
body:`<p><b>am / is / are + глагол-ing</b> — действие идёт сейчас.<br><i>My sister <b>is reading</b> a book right now.</i></p>
<p>Маркеры: <b>now, right now, at the moment, Look!, Listen!</b></p>
<p>Отрицание: <i>He isn't playing.</i> Вопрос: <i>Are you watching TV?</i></p>`,

{id:"dir",sec:4,unit:"4.4",title:"Как пройти: directions",
body:`<p><b>Спросить:</b> Excuse me, how can I get to…? · Could you tell me the way to…?</p>
<p><b>Объяснить:</b> go straight on — прямо · turn left / right — налево / направо · at the traffic lights — на светофоре · at the roundabout — на кольце · on the corner — на углу · opposite — напротив · pass the station — пройти мимо станции · crossroads — перекрёсток</p>`,
qs:[["Идти прямо —","go straight on","go straight in","go forward on"],["Напротив —","opposite","near","next"],["На углу —","on the corner","in the corner","at corner"],["Круговое движение —","roundabout","crossroads","traffic lights"],["Вежливо спросить дорогу:","Could you tell me the way to the station?","Where station?","Tell me station way."],["Пройти мимо станции —","pass the station","past the station go","cross the station"]]},

{id:"some",sec:4,unit:"4.5",title:"a / an / some / any",
body:`<p><b>a / an</b> — одна штука (исчисляемое, ед. ч.): <i>a fork, an umbrella</i>.</p>
<p><b>some</b> — в утверждениях и в предложениях/просьбах:<br><i>I have some pencils. Would you like some juice?</i></p>
<p><b>any</b> — в отрицаниях и вопросах:<br><i>I don't have any rice. Is there any butter?</i></p>`,
qs:[["Do you have ___ pens?","any","some","a"],["I don't have ___ rice, but I have ___ pasta.","any … some","some … any","a … some"],["Would you like ___ juice?","some","any","a"],["Can I have ___ umbrella?","an","a","some"],["There are ___ birds in the tree.","some","any","a"],["There wasn't ___ milk left.","any","some","a"],["It's ___ interesting movie.","an","a","some"]]},

{id:"much",sec:4,unit:"4.6",title:"Much / many, How much / How many",
body:`<table><tr><td><b>Исчисляемые</b> (apples, books, friends)</td><td>many · a few · <b>How many?</b></td></tr><tr><td><b>Неисчисляемые</b> (water, milk, sugar, money, time, sleep)</td><td>much · a little · a bit of · <b>How much?</b></td></tr></table>
<p><b>a lot of / lots of</b> — для обоих.<br>Упаковки: a <b>bottle</b> of water, a <b>cup</b> of tea, a <b>glass</b> of water, a <b>piece</b> of cake, a <b>jar</b>, a <b>tin / can</b>, a <b>packet</b>, a <b>carton</b>.</p>`,
qs:[["___ apples are there?","How many","How much"],["___ milk do you need?","How much","How many"],["___ time do you spend on your phone?","How much","How many"],["___ languages can you speak?","How many","How much"],["I don't have ___ money.","much","many","a few"],["There's too ___ sugar in it.","much","many","few"],["a ___ of cake","piece","bottle","jar"],["a ___ of water","bottle","piece","packet"]]},

{id:"going",sec:4,unit:"4.7",title:"To be going to — планы",
body:`<p><b>am / is / are + going to + глагол</b> — то, что уже решили сделать.</p>
<table><tr><td>(+)</td><td><i>She's going to learn the guitar.</i></td></tr><tr><td>(−)</td><td><i>He isn't going to buy a car.</i></td></tr><tr><td>(?)</td><td><i>Are they going to paint the house? — Yes, they are.</i></td></tr></table>
<p>Ещё — прогноз по признакам: <i>Look at the clouds! It's going to rain.</i></p>`,

/* ====== СБОРКА ЗАДАНИЙ ====== */
function wordItem(w,forceMC){
  if(!forceMC&&box(w.k)>=3)return{type:"flip",w};
  const dir=Math.random()<.5?"en":"ru";
  const ans=dir==="en"?w.ru:w.en;
  let pool=shuffle(WORDS.filter(x=>x.set===w.set&&x.k!==w.k));
  if(pool.length<3)pool=pool.concat(shuffle(WORDS.filter(x=>x.set!==w.set)));
  const seen=new Set([norm(ans)]),dis=[];
  for(const x of pool){const v=dir==="en"?x.ru:x.en;if(!seen.has(norm(v))){seen.add(norm(v));dis.push(v)}if(dis.length===3)break}
  return{type:"mc",w,dir,prompt:dir==="en"?w.en:w.ru,correct:ans,opts:shuffle([ans,...dis])};
}
const verbItem=v=>({type:"verb",v});
function ruleQ(r,i){const q=r.qs[i];if(Array.isArray(q))return{type:"rq",r,prompt:q[0],correct:q[1],opts:shuffle(q.slice(1))};return{type:"rt",r,prompt:q.t,a:q.a}}
const pick=(arr,n)=>shuffle(arr).slice(0,n);

function chooseWords(pool,n){
  const due=pool.filter(w=>isDue(w.k)).sort((a,b)=>S.items[a.k].d-S.items[b.k].d);
  const fresh=pool.filter(w=>isNew(w.k)).sort((a,b)=>parseFloat(b.set)-parseFloat(a.set));
  let out=due.slice(0,n);
  if(out.length<n)out=out.concat(fresh.slice(0,n-out.length));
  if(out.length<n){const rest=shuffle(pool.filter(w=>!out.includes(w))).sort((a,b)=>box(a.k)-box(b.k));out=out.concat(rest.slice(0,n-out.length))}
  return out;
}
function chooseVerbs(pool,n){
  const due=pool.filter(v=>isDue(v.k)).sort((a,b)=>S.items[a.k].d-S.items[b.k].d);
  const fresh=pool.filter(v=>isNew(v.k));
  let out=due.slice(0,n);
  if(out.length<n)out=out.concat(fresh.slice(0,n-out.length));
  if(out.length<n){const rest=shuffle(pool.filter(v=>!out.includes(v))).sort((a,b)=>box(a.k)-box(b.k));out=out.concat(rest.slice(0,n-out.length))}
  return out;
}
function focusRule(){
  const rk=r=>"r:"+r.id;
  const due=RULES.filter(r=>isDue(rk(r))).sort((a,b)=>S.items[rk(a)].d-S.items[rk(b)].d);
  if(due.length)return due[0];
  const fresh=RULES.filter(r=>isNew(rk(r)));
  if(fresh.length)return fresh[fresh.length-1];
  return RULES.slice().sort((a,b)=>(S.items[rk(a)].d-S.items[rk(b)].d))[0];
}
function wordPool(){return S.focus?WORDS.filter(w=>w.sec===S.focus):WORDS}
function plan5(){
  const r=focusRule();const pool=wordPool();
  const words=chooseWords(pool,8),verbs=chooseVerbs(VERBS,5);
  return{r,words,verbs,dueW:pool.filter(w=>isDue(w.k)).length,dueV:VERBS.filter(v=>isDue(v.k)).length};
}
function build5(){
  const p=plan5();
  const q=[{type:"card",r:p.r}];
  pick([...p.r.qs.keys()],3).forEach(i=>q.push(Object.assign(ruleQ(p.r,i),{focus:true})));
  const seenRules=RULES.filter(r=>r.id!==p.r.id&&!isNew("r:"+r.id));
  const review=pick(seenRules,2).map(r=>Object.assign(ruleQ(r,Math.floor(Math.random()*r.qs.length)),{review:true}));
  const mix=shuffle([...p.words.map(w=>wordItem(w)),...p.verbs.map(verbItem),...review]);

let R=null;

function cur(){return R.queue[R.i]}
function record(item,ok,key){
  if(item.retry){return}
  R.total++;if(ok)R.ok++;
  if(item.type==="rq"||item.type==="rt"){
    const id=item.r.id;
    if(item.review){if(!ok&&S.items["r:"+id]){S.items["r:"+id].d=0;save()}}
    else{const t=R.tally[id]||(R.tally[id]={ok:0,n:0});t.n++;if(ok)t.ok++}
  }else if(key){grade(key,ok)}
  if(!ok){
    let line="";
    if(item.type==="mc")line=`<b>${esc(item.w.en)}</b> — ${esc(item.w.ru)}`;
    else if(item.type==="flip")line=`<b>${esc(item.w.en)}</b> — ${esc(item.w.ru)}`;
    else if(item.type==="verb")line=`<b>${esc(item.v.b)} — ${esc(item.v.p)} — ${esc(item.v.pp)}</b> (${esc(item.v.ru)})`;
    else if(item.type==="rq")line=`${esc(item.prompt)} → <b>${esc(item.correct)}</b> <span class="muted">· ${esc(item.r.title)}</span>`;
    else if(item.type==="rt")line=`${esc(item.prompt)} → <b>${esc(item.a[0])}</b> <span class="muted">· ${esc(item.r.title)}</span>`;
    R.mistakes.push(line);
    if((item.type==="mc"||item.type==="flip"||item.type==="verb")&&!R.retried.has(item)){
      R.retried.add(item);
      const again=item.type==="verb"?{type:"verb",v:item.v,retry:true}:Object.assign(wordItem(item.w,true),{retry:true});
      R.queue.push(again);
    }
  }
}
function next(){R.i++;R.answered=false;if(R.i>=R.queue.length)finish();else render()}
function finish(){
  for(const [id,t] of Object.entries(R.tally))grade("r:"+id,t.ok/t.n>=.66);
  markDay();view="end";render();
  clearTimeout(cloud.timer);pushCloud();
}

    <div class="actions"><button class="btn" type="submit">Проверить</button><button class="btn ghost" type="button" id="dunno">Не помню</button></div></form><div id="fb"></div></div>`;
  }
  app.innerHTML=`<div class="sessbar"><div class="progress" aria-label="Прогресс"><i style="width:${pct}%"></i></div><span class="small muted" style="font-family:var(--f-mono)">${R.i+1}/${R.queue.length}</span><button class="linkbtn" id="quit">Закончить</button></div>${body}`;

function showNext(extra){
  const fb=document.getElementById("fb");
  fb.insertAdjacentHTML("afterend",(extra||"")+`<div class="actions"><button class="btn" id="nextBtn">Дальше →</button></div>`);
  R.answered=true;document.getElementById("nextBtn").focus();
}
function miniRule(r){return `<div class="mini-rule rule"><h3>Напоминание: ${esc(r.title)}</h3><div class="tablewrap">${r.body}</div></div>`}
function answerOpt(i){
  const it=cur();if(R.answered)return;
  const chosen=it.opts[i],ok=chosen===it.correct;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(it.opts[j]===it.correct)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  record(it,ok,it.type==="mc"?it.w.k:null);
  let txt="";
  if(it.type==="mc")txt=`<b>${esc(it.w.en)}</b> ${sayBtn(it.w.en)} — ${esc(it.w.ru)}`;
  else txt=ok?"":`Правильно: <b>${esc(it.correct)}</b>`;
  document.getElementById("fb").innerHTML=feedbackHtml(ok,txt);
  showNext(!ok&&it.type==="rq"?miniRule(it.r):"");
  if(ok&&it.type==="mc"&&it.dir==="ru"&&canSpeak)speak(it.w.en);
}
function answerType(){
  const it=cur();if(R.answered)return;
  const inp=document.getElementById("t1");const ok=it.a.some(a=>norm(a)===norm(inp.value));

  record(it,ok,null);
  document.getElementById("fb").innerHTML=feedbackHtml(ok,ok?"":`Правильно: <b>${esc(it.a[0])}</b>`);

}
function answerVerb(giveUp){
  const it=cur();if(R.answered)return;const v=it.v;
  const a=document.getElementById("v2"),b=document.getElementById("v3");
  const ok2=!giveUp&&accepts(a.value,v.p),ok3=!giveUp&&accepts(b.value,v.pp),ok=ok2&&ok3;
  a.classList.add(ok2?"ok":"bad");b.classList.add(ok3?"ok":"bad");a.readOnly=b.readOnly=true;
  record(it,ok,v.k);
  document.getElementById("fb").innerHTML=feedbackHtml(ok,`<b>${esc(v.b)} — ${esc(v.p)} — ${esc(v.pp)}</b> ${sayBtn(v.b+", "+v.p.replace("/"," or ")+", "+v.pp.replace("/"," or "))}`);
  showNext();
}

/* ====== СВОИ СЛОВА И ПРАВИЛА (раздел «Добавить», только для админа) ====== */
let isAdmin=false,contentRows=[],adminMsg="",adminKind="words";
const loadedContent=new Set();
const secOf=u=>Math.max(1,parseInt(u,10)||1);
function richText(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>")}
function ruleBody(text){return String(text).split(/\n\s*\n|\n/).map(l=>l.trim()).filter(Boolean).map(l=>"<p>"+richText(l)+"</p>").join("")}
function parseWordLines(text){
  const out=[];
  for(const raw of String(text).split("\n")){
    const l=raw.trim();if(!l)continue;
    const m=l.split(/\s*\|\s*|\t|\s+[—–-]\s+|\s*=\s*/);
    if(m.length>=2&&m[0]&&m[1])out.push([m[0].trim(),m.slice(1).join(", ").trim()]);
  }
  return out;
}
function parseQuestions(text){
  const out=[];
  for(const raw of String(text).split("\n")){
    const p=raw.split("|").map(s=>s.trim()).filter(Boolean);
    if(p.length>=3)out.push(p);
    else if(p.length===2)out.push({t:p[0],a:p[1].split("/").map(s=>s.trim()).filter(Boolean)});
  }
  return out;
}
function applyContent(row){
  if(loadedContent.has(row.id))return;loadedContent.add(row.id);
  if(row.kind==="words"){
    const id=row.unit;
    if(!SETNAME[id]){SETNAME[id]=row.title;WORDSETS.push([id,row.sec,row.title,""]);WORDSETS.sort((a,b)=>parseFloat(a[0])-parseFloat(b[0]))}
    for(const [en,ru] of row.data.words||[]){const k="w:"+id+":"+en;if(!WORDS.some(w=>w.k===k))WORDS.push({k,en,ru,set:id,sec:row.sec})}
  }else if(row.kind==="rule"){
    const r={id:"c"+row.id,sec:row.sec,unit:row.unit,title:row.title,body:ruleBody(row.data.text||""),qs:row.data.qs||[]};
    if(r.qs.length){RULES.push(r);RULE[r.id]=r}
  }
}
async function loadContent(){
  try{const {data,error}=await sb.from("content").select("*").order("created_at");if(error)throw error;contentRows=data||[];contentRows.forEach(applyContent)}catch(e){console.warn(e)}
}

  const w=adminKind==="words";
  return shell(`<div class="stack">

      ${w?`<div class="field"><label for="cwords">Слова — по одному в строке: english - перевод</label><textarea class="ans" id="cwords" rows="10" required placeholder="cinema - кинотеатр&#10;to dream of - мечтать о"></textarea></div>`
      :`<div class="field"><label for="ctext">Объяснение — каждая строка станет абзацем, **жирный** выделяется звёздочками</label><textarea class="ans" id="ctext" rows="6" required placeholder="**have/has + V3** — результат к настоящему моменту.&#10;I have finished my homework."></textarea></div>
      <div class="field"><label for="cqs">Вопросы — по одному в строке:<br>вопрос | правильный | неправильный | неправильный<br>или для ввода с клавиатуры: вопрос | ответ</label><textarea class="ans" id="cqs" rows="8" required placeholder="She ___ finished. | has | have | is&#10;go → V3 | gone"></textarea></div>`}
      <button class="btn" type="submit">Добавить</button>
    </form>
    ${adminMsg?`<div class="feedback ${adminMsg.startsWith("✓")?"ok":"bad"}" role="status">${adminMsg}</div>`:""}
  </div>
  <div class="sheet"><div class="label" style="margin-bottom:6px">Добавлено тобой</div>
  ${contentRows.length?`<div class="list">${contentRows.map(r=>`<div class="li"><span class="u">${esc(r.unit)}</span><span class="t">${r.kind==="words"?"Слова":"Правило"}: ${esc(r.title)} <span class="muted small">(${r.kind==="words"?(r.data.words||[]).length+" сл.":(r.data.qs||[]).length+" вопр."})</span></span><span id="del${r.id}"><button class="linkbtn" data-del="${r.id}">удалить</button></span></div>`).join("")}</div>`:`<p class="small muted" style="margin:0">Пока ничего. Добавленное сразу появится у всех во вкладках «Слова» и «Правила» после входа на сайт.</p>`}
  </div></div>`,"admin");
}
async function submitAdmin(){
  const unit=document.getElementById("cunit").value.trim().replace(",","."),title=document.getElementById("ctitle").value.trim();
  let data;
  if(adminKind==="words"){
    const words=parseWordLines(document.getElementById("cwords").value);
    if(!words.length){adminMsg="Не нашёл ни одного слова. Формат строки: english - перевод";render();return}
    data={words};
  }else{
    const qs=parseQuestions(document.getElementById("cqs").value);
    if(!qs.length){adminMsg="Не нашёл ни одного вопроса. Формат: вопрос | правильный | неправильный";render();return}
    data={text:document.getElementById("ctext").value,qs};
  }
  const {data:row,error}=await sb.from("content").insert({kind:adminKind,unit,sec:secOf(unit),title,data}).select().single();
  if(error){adminMsg="Не удалось сохранить: "+esc(error.message);render();return}
  contentRows.push(row);applyContent(row);
  adminMsg=`✓ Добавлено: ${esc(title)} (${adminKind==="words"?data.words.length+" слов":data.qs.length+" вопросов"}).`;
  render();
}
async function deleteContent(id){
  const {error}=await sb.from("content").delete().eq("id",id);
  if(error){adminMsg="Не удалось удалить: "+esc(error.message);render();return}
  contentRows=contentRows.filter(r=>r.id!==id);
  adminMsg="✓ Удалено. У всех исчезнет после обновления страницы.";render();
}

app.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.auth){authMode=t.dataset.auth;authMsg="";renderAuth();return}
  if(t.id==="logout"){if(cloud.dirty)pushCloud().finally(()=>sb.auth.signOut());else sb.auth.signOut();return}
  activity();
  if(t.dataset.say!==undefined){speak(t.dataset.say);return}
  if(t.dataset.akind){adminKind=t.dataset.akind;adminMsg="";render();return}
  if(t.dataset.del){const id=+t.dataset.del;document.getElementById("del"+id).innerHTML=`<button class="btn badb" data-delyes="${id}" style="padding:6px 10px">Точно удалить</button>`;return}
  if(t.dataset.delyes){deleteContent(+t.dataset.delyes);return}
  if(t.dataset.tab){adminMsg="";view=t.dataset.tab;sub=null;R=null;render();window.scrollTo(0,0);return}
  if(t.id==="go5"||t.id==="again"){startSession(build5());return}
  if(t.dataset.focus!==undefined){S.focus=+t.dataset.focus;save();render();return}
  if(t.id==="reset"){document.getElementById("resetArea").innerHTML=`<div class="confirm"><span>Удалить весь прогресс?</span><button class="btn badb" id="resetYes">Да, удалить</button><button class="btn ghost" id="resetNo">Отмена</button></div>`;return}
  if(t.id==="resetYes"){const keep=S.time;S=blank();S.time=keep;save();render();return}
  if(t.id==="resetNo"){render();return}
  if(t.dataset.rule){sub=t.dataset.rule;render();window.scrollTo(0,0);return}
  if(t.dataset.set){sub=t.dataset.set;render();window.scrollTo(0,0);return}
  if(t.dataset.back!==undefined){sub=null;render();return}
  if(t.dataset.trainRule){const r=RULE[t.dataset.trainRule];startSession({title:r.title,queue:[...shuffle([...r.qs.keys()]).map(i=>ruleQ(r,i))]});return}
  if(t.dataset.trainSet){const ws=WORDS.filter(w=>w.set===t.dataset.trainSet);startSession({title:SETNAME[t.dataset.trainSet],queue:shuffle(chooseWords(ws,12).map(w=>wordItem(w)))});return}
  if(t.dataset.part!==undefined){verbPart=+t.dataset.part;render();return}
  if(t.id==="trainVerbs"){const pool=VERBS.filter(v=>!verbPart||v.part===verbPart);startSession({title:"Глаголы",queue:shuffle(chooseVerbs(pool,10).map(verbItem))});return}
  if(view!=="session")return;
  if(t.id==="quit"){if(R.total)finish();else{view="home";R=null;render()}return}
  if(t.id==="nextBtn"){next();return}
  if(t.dataset.opt!==undefined){answerOpt(+t.dataset.opt);return}
  if(t.id==="dunno"){answerVerb(true);return}
  if(t.id==="showBtn"){const it=cur();document.getElementById("flipArea").outerHTML=`<div class="feedback ok" style="color:var(--text)"><b style="color:var(--ink);font-size:1.2rem">${esc(it.w.en)}</b> ${sayBtn(it.w.en)}</div><div class="actions"><button class="btn badb" id="flipNo">Не вспомнил</button><button class="btn okb" id="flipYes">Вспомнил</button></div>`;if(canSpeak)speak(it.w.en);document.getElementById("flipYes").focus();return}
  if(t.id==="flipYes"||t.id==="flipNo"){const it=cur();record(it,t.id==="flipYes",it.w.k);next();return}
});
app.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="authForm"){doAuth();return}if(e.target.id==="adminForm"){submitAdmin();return}activity();if(e.target.id==="tform")answerType();else if(e.target.id==="vform")answerVerb(false)});
app.addEventListener("input",e=>{if(e.target.id==="vsearch"){verbQ=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById("vsearch");s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("keydown",e=>{
  if(view!=="session"||!R)return;
  activity();
  const it=cur();
  if(e.key==="Enter"&&R.answered&&!e.target.matches("button")){e.preventDefault();next();return}
  if(!R.answered&&(it.type==="mc"||it.type==="rq")&&/^[1-4]$/.test(e.key)&&+e.key<=it.opts.length){answerOpt(+e.key-1)}
});
/* ====== ЗАПУСК ====== */
if(!configured){
  app.innerHTML=`<div class="sheet margin stack"><div class="brand">English за 5 минут</div><p>Сайт ещё не подключён к базе. Открой файл <b>index.html</b> и впиши в самом начале скрипта <b>SUPABASE_URL</b> и <b>SUPABASE_KEY</b> из своего проекта Supabase (Project Settings → API).</p></div>`;
}else if(!window.supabase){
  app.innerHTML=`<div class="sheet margin"><p>Не загрузилась библиотека Supabase. Проверь интернет и обнови страницу.</p></div>`;
}else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  app.innerHTML=`<p class="muted">Загрузка…</p>`;
  sb.auth.onAuthStateChange((event,session)=>{
    setTimeout(()=>{
      if(session&&session.user){if(!me||me.id!==session.user.id)afterLogin(session.user)}
      else{me=null;S=blank();view="home";R=null;renderAuth()}
    },0);
  });
}

</script>
</body>
